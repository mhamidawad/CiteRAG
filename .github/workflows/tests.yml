name: CiteRAG baseline tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned CPU dependencies
        run: python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.lock.txt
      - name: Scan tracked source for secrets
        run: python tasks/scan-secrets.py
      - name: Audit reachable Git history for secret patterns
        run: python tasks/scan-secrets.py --history
      - name: Unit and regression tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python modules
        run: python -m compileall -q citerag tests tasks
