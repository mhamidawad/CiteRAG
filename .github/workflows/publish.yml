name: Publish CiteRAG GHCR release candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # Only reviewed code from the default branch may publish an image.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan source and reachable history before packaging
        run: |
          python3 tasks/scan-secrets.py
          python3 tasks/scan-secrets.py --history
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install exact release dependency versions
        run: python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.lock.txt
      - name: Test and compile the exact release source
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q citerag tests tasks
      - name: Verify real MiniLM embeddings and hybrid retrieval offline
        env:
          PYTHONPATH: .
          CITERAG_MODEL_CACHE_DIR: ${{ runner.temp }}/citerag-models
          HF_HUB_OFFLINE: "0"
          CITERAG_OFFLINE: "1"
        run: |
          python -c 'from huggingface_hub import snapshot_download; import os; snapshot_download("sentence-transformers/all-MiniLM-L6-v2", revision="1110a243fdf4706b3f48f1d95db1a4f5529b4d41", cache_dir=os.environ["CITERAG_MODEL_CACHE_DIR"], allow_patterns=["*.json", "*.safetensors", "*.txt"])'
          HF_HUB_OFFLINE=1 python tasks/verify-retrieval.py
      - name: Audit pinned Python dependency advisories
        run: |
          mkdir -p release-evidence
          python -m venv /tmp/citerag-audit
          /tmp/citerag-audit/bin/pip install pip-audit==2.10.1
          /tmp/citerag-audit/bin/pip-audit --vulnerability-service osv --disable-pip --no-deps -r requirements.lock.txt --format json --output release-evidence/dependency-audit.json
      - name: Verify pinned vendor backport evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tasks/fetch-vendor-vex.py
      - name: Authenticate to free hardened base registry
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
        run: printf '%s' "$DHI_TOKEN" | docker login dhi.io -u "$DHI_USERNAME" --password-stdin
      - name: Build reviewed source on hosted runner
        env:
          IMAGE: ghcr.io/mhamidawad/citerag:sha-${{ github.sha }}
        run: docker build --pull --label "org.opencontainers.image.revision=${{ github.sha }}" --tag "$IMAGE" .
      - name: Verify nonroot, offline, read-only runtime
        env:
          IMAGE: ghcr.io/mhamidawad/citerag:sha-${{ github.sha }}
        run: |
          test "$(docker image inspect "$IMAGE" --format '{{.Config.User}}')" = "65532:65532"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 3g --cpus 2 --tmpfs /tmp:rw,nosuid,size=64m "$IMAGE" python -c 'import citerag.web, citerag.server, lancedb, sentence_transformers; print("CITERAG_RELEASE_IMPORT_OK")'
      - name: Scan raw image and enforce exact-product vendor dispositions
        env:
          IMAGE: ghcr.io/mhamidawad/citerag:sha-${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker run --rm --network bridge \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/release-evidence:/evidence" \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            aquasec/trivy@sha256:6fa071ef8daa2e58b90cbf1710bedca91adbb3bf98693533226f442035b836a6 \
            image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 \
            --timeout 10m --format json --output /evidence/image-audit-raw.json "$IMAGE"
          python tasks/derive-vendor-vex.py --raw-report release-evidence/image-audit-raw.json
          docker run --rm --network bridge \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/release-evidence:/evidence" \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            aquasec/trivy@sha256:6fa071ef8daa2e58b90cbf1710bedca91adbb3bf98693533226f442035b836a6 \
            image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            --vex /evidence/dhi-python-exact.vex.json \
            --timeout 10m --format json --output /evidence/image-audit.json "$IMAGE"
      - name: Record source and image identity
        env:
          IMAGE: ghcr.io/mhamidawad/citerag:sha-${{ github.sha }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          printf '%s\n' "$SOURCE_SHA" > release-evidence/source-sha.txt
          docker image inspect "$IMAGE" --format '{{.Id}}' > release-evidence/image-id.txt
      - name: Login to GHCR using scoped ephemeral token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Publish SHA-tagged image and record digest
        env:
          IMAGE: ghcr.io/mhamidawad/citerag:sha-${{ github.sha }}
        run: |
          docker push "$IMAGE"
          docker tag "$IMAGE" ghcr.io/mhamidawad/citerag:latest
          docker push ghcr.io/mhamidawad/citerag:latest
          docker image inspect "$IMAGE" --format '{{json .RepoDigests}}' > release-evidence/image-digests.json
          cat release-evidence/image-digests.json
          docker logout ghcr.io

      - name: Preserve release verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: warn
          retention-days: 30
